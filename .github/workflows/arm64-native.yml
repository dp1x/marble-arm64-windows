name: Build Native ARM64

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 240
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v?(\d+\.\d+\.\d+)') {
            $version = $Matches[1]
          } else {
            # Fallback for workflow_dispatch / schedule with no tag
            $fallback = (git describe --tags --abbrev=0 2>$null)
            if ($fallback -match '^v?(\d+\.\d+\.\d+)') { $version = $Matches[1] }
            else { $version = "22.07.70" }
          }
          $version = $version.Trim()
          Write-Host "Resolved MARBLE_VERSION=$version (from ref '${{ github.ref_name }}')"
          Add-Content -Path $env:GITHUB_ENV -Value "MARBLE_VERSION=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "MARBLE_VERSION=$version" -Encoding utf8

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\buildtrees
            C:\vcpkg\packages
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: ${{ runner.os }}-arm64-marble-vcpkg-${{ hashFiles('.github/workflows/arm64-native.yml') }}

      - name: Install Dependencies (vcpkg)
        shell: powershell
        run: |
          $env:PATH = "C:\vcpkg;" + $env:PATH
          $maxRetries = 5
          $retry = 0
          do {
            $retry++
            Write-Host "vcpkg install attempt $retry of $maxRetries"
            vcpkg install --recurse zlib:arm64-windows protobuf:arm64-windows qt5-base[core,openssl]:arm64-windows qt5-svg:arm64-windows qt5-declarative:arm64-windows qt5-tools:arm64-windows qt5-webchannel:arm64-windows qt5-webengine:arm64-windows
            $lastExitCode = $LASTEXITCODE
            if ($lastExitCode -ne 0 -and $retry -lt $maxRetries) {
              Write-Host "vcpkg install failed with exit code $lastExitCode, retrying in 120 seconds..."
              Start-Sleep -Seconds 120
            }
          } while ($lastExitCode -ne 0 -and $retry -lt $maxRetries)
          if ($lastExitCode -ne 0) {
            Write-Error "vcpkg install failed after $maxRetries attempts"
            exit 1
          }

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A ARM64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DRELEASE_SERVICE_VERSION="${{ env.MARBLE_VERSION }}" `
            -DMARBLE_DATA_PATH="data" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=arm64-windows `
            -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /W3 /GR /EHsc /D_CRT_SECURE_NO_WARNINGS /std:c++17" `
            -DCMAKE_CXX_STANDARD=17 `
            -DBUILD_MARBLE_TESTS=OFF `
            -DBUILD_MARBLE_EXAMPLES=OFF `
            -DBUILD_MARBLE_TOOLS=OFF `
            -DBUILD_MARBLE_APPS=ON `
            -DBUILD_WITH_DBUS=OFF

      - name: Build Project
        shell: powershell
        run: cmake --build build --config Release --parallel 2

      - name: Install (CMake --install)
        shell: powershell
        run: |
          cmake --install build --config Release --prefix dist_install
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake install failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "CMake install completed successfully"

      - name: Collect Artifacts
        shell: powershell
        run: |
          $distDir = "dist"
          if (Test-Path $distDir) { Remove-Item $distDir -Recurse -Force }
          New-Item -ItemType Directory -Path "$distDir\plugins\platforms" | Out-Null
          New-Item -ItemType Directory -Path "$distDir\plugins\bearer" | Out-Null
          New-Item -ItemType Directory -Path "$distDir\plugins\imageformats" | Out-Null
          New-Item -ItemType Directory -Path "$distDir\plugins\sqldrivers" | Out-Null
          New-Item -ItemType Directory -Path "$distDir\plugins\styles" | Out-Null

          $appDirs = @(
            "build\src\apps\marble-qt\Release",
            "build\src\lib\marblewidget\Release"
          )
          foreach ($dir in $appDirs) {
            if (Test-Path $dir) {
              Get-ChildItem "$dir\*.dll","$dir\*.exe" -ErrorAction SilentlyContinue |
                Copy-Item -Destination $distDir -Force
            }
          }

          Get-ChildItem "build" -Recurse -Filter "*Plugin.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "platforms|bearer|imageformats|sqldrivers|styles" } |
            Copy-Item -Destination "$distDir\plugins" -Force

          Get-ChildItem "build\plugins" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object {
              $base = Resolve-Path "build\plugins"
              $rel = $_.FullName.Substring($base.Path.Length + 1)
              $dest = Join-Path $distDir $rel
              $destDir = Split-Path $dest -Parent
              if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir | Out-Null }
              Copy-Item $_.FullName $dest -Force
            }

          $vcpkgDir = "C:\vcpkg\installed\arm64-windows"
          $vcpkgBinDir = Join-Path $vcpkgDir "bin"
          $vcpkgPluginsDir = Join-Path $vcpkgDir "plugins"
          $exclude = @("libprotobuf-lite.dll", "libprotoc.dll")
          if (Test-Path $vcpkgBinDir) {
            Get-ChildItem $vcpkgBinDir -Filter "*.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notin $exclude } |
              Copy-Item -Destination $distDir -Force
          }

          if (Test-Path $vcpkgPluginsDir) {
            Get-ChildItem $vcpkgPluginsDir -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object {
                $rel = $_.FullName.Substring($vcpkgDir.Length + 1)
                $dest = Join-Path $distDir $rel
                $destDir = Split-Path $dest -Parent
                if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir | Out-Null }
                Copy-Item $_.FullName $dest -Force
              }
          }

          if (Test-Path "dist_install\data") {
            if (Test-Path "$distDir\data") { Remove-Item "$distDir\data" -Recurse -Force }
            Copy-Item "dist_install\data" "$distDir\data" -Recurse -Force
          } else {
            Write-Error "CRITICAL: dist_install\data not found - Marble data files missing from cmake --install output!"
            exit 1
          }

          $requiredDataDirs = @("maps", "placemarks", "bitmaps", "svg")
          foreach ($requiredDir in $requiredDataDirs) {
            if (-not (Test-Path "$distDir\data\$requiredDir")) {
              Write-Error "CRITICAL: data\$requiredDir missing from dist - Marble data files not installed correctly!"
              exit 1
            }
          }
          Write-Host "Data directory verified: maps, placemarks, bitmaps, svg all present"

          if (-not (Test-Path "dist\plugins\platforms\qwindows.dll")) {
            Write-Error "CRITICAL: qwindows.dll missing from plugins/platforms/"
            exit 1
          }

      - name: Create Release Archive
        shell: powershell
        run: |
          $version = $env:MARBLE_VERSION.Trim()
          if (-not $version) { $version = "22.07.70" }
          $zipName = "marble-arm64-win-$version.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "dist\*" -DestinationPath $zipName -CompressionLevel Optimal
          $sizeMB = [math]::Round((Get-Item $zipName).Length / 1MB, 1)
          Write-Host "Created $zipName ($sizeMB MB)"

      - name: Generate SHA256SUMS
        shell: powershell
        run: |
          $version = $env:MARBLE_VERSION.Trim()
          if (-not $version) { $version = "22.07.70" }
          $zipName = "marble-arm64-win-$version.zip"
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath SHA256SUMS -Encoding ascii
          Write-Host "SHA256: $hash"
          Get-Content SHA256SUMS

      - name: Verify Checksums
        shell: powershell
        run: |
          $version = $env:MARBLE_VERSION.Trim()
          if (-not $version) { $version = "22.07.70" }
          $zipName = "marble-arm64-win-$version.zip"
          $stored = (Get-Content SHA256SUMS).Split(' ')[0]
          $computed = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          if ($stored -ne $computed) {
            Write-Error "SHA256 mismatch! stored=$stored computed=$computed"
            exit 1
          }
          Write-Host "Checksum verified OK"

      - name: Attest Build Provenance (SLSA v1)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'marble-arm64-win-${{ env.MARBLE_VERSION }}.zip'

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Marble ${{ env.MARBLE_VERSION }} (ARM64 Windows)
          body: |
            Native Windows ARM64 build of KDE Marble ${{ env.MARBLE_VERSION }}.

            ## Installation
            1. Extract `marble-arm64-win-${{ env.MARBLE_VERSION }}.zip`
            2. Run `marble-qt.exe`

            ## Verification
            Verify the download with the included SHA256SUMS:
            ```powershell
            certutil -hashfile marble-arm64-win-${{ env.MARBLE_VERSION }}.zip SHA256
            ```

            ## Provenance
            Build provenance (SLSA v1): https://github.com/dp1x/marble-arm64-windows/attestations/${{ github.run_id }}
            Source commit: `${{ github.sha }}`
            Workflow run: https://github.com/dp1x/marble-arm64-windows/actions/runs/${{ github.run_id }}

            ## Upstream
            This is built from KDE Marble v${{ env.MARBLE_VERSION }}: https://invent.kde.org/education/marble/-/releases/v${{ env.MARBLE_VERSION }}

            This release was built automatically by GitHub Actions with Sigstore attestation.
          files: |
            marble-arm64-win-${{ env.MARBLE_VERSION }}.zip
            SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
